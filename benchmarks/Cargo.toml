[package]
name = "sailing-benchmark"
description = "Cluster-throughput benchmarks for sailing: a parity harness matching openraft, and a pure consensus-core harness isolating the Sans-I/O logic"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sailing-proto = { workspace = true, features = ["std"] }
sailing-simulation = { path = "../tests/sailing-simulation" }
bytes.workspace = true
clap.workspace = true
# The `parity` bench runs the cluster on a real async runtime to mirror openraft's harness.
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
# The `sharded_host` bench stands up a real K-plane compio host cluster over loopback TCP; the ring
# crypto backend matches how the compio crate itself is exercised (the bench uses plaintext
# `Passthrough`, but the tls/quic passthroughs still need a backend to compile). `futures-executor`
# drives the `Send` handle futures from a plain thread (no compio runtime caller-side), and
# `futures-util::join_all` pipelines a batch of concurrent submits per group.
sailing-compio = { workspace = true, features = [
  "tls-rustls-ring",
  "quic-rustls-ring",
] }
futures-executor = { version = "0.3", default-features = false, features = [
  "std",
] }
futures-util = { workspace = true, features = ["std"] }

[[bin]]
name = "pure_core"
path = "src/bin/pure_core.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[[bin]]
name = "sharded_host"
path = "src/bin/sharded_host.rs"
