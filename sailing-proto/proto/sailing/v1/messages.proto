// The sailing consensus wire envelope (normative; WIRE.md references this file).
//
// Generic seams: every `bytes` field named `*_id`, the `voters`/`learners`/
// `voters_outgoing`/`learners_next` sets, and `ConfChangeSingle.node_id` carry the
// embedder's NodeId encoded by its `Data` impl (1..=1024 bytes, decoded with
// decode_exact — trailing bytes reject). Entry payloads and snapshot blobs are opaque
// application bytes.
//
// Envelope semantics are protobuf (proto3): absent scalars decode as zero/empty —
// identical in meaning to an explicit zero; duplicate scalars are last-wins while
// duplicate embedded messages MERGE (and a same-variant oneof re-occurrence merges
// too — see WIRE.md for the precise rules); unknown fields are skipped (forward
// compatibility). Sailing's stricter validation —
// set elements strictly ascending by decoded value, id presence and bounds, nanos
// bounds, body presence — is enforced at the wire→programming conversion and
// documented in WIRE.md.

syntax = "proto3";

package sailing.v1;

// One replicated log entry.
message Entry {
  uint64 term = 1;
  uint64 index = 2;
  EntryKind kind = 3;
  // The application command (Normal), the encoded ConfChange (ConfChange), or empty.
  bytes data = 4;
  // The leader's clock when it appended this entry (nanos since the node's monotonic ORIGIN),
  // used ONLY by the LeaseGuard read mode to age the entry across a leader change. Zero (the
  // proto3 default) in every other mode — absent on the wire, so a non-LeaseGuard entry encodes
  // exactly as before. Cross-node comparability requires the driver to anchor each node's ORIGIN
  // to a synchronized epoch (the LeaseGuard bounded-skew assumption); see WIRE.md.
  uint64 timestamp = 5;
  // The LeaseGuard commit-wait window of the appending leader (nanos; the exact
  // lease_duration*(lease_duration+clock_drift_bound)/(lease_duration-clock_drift_bound), see the
  // Config::clock_drift_bound docs): how long a successor must wait, from a lower bound on this
  // entry's creation, before this
  // leader's read-lease has provably expired. Self-describing, so a successor sizes its commit-wait
  // by the MAX window over inherited entries with no assumption about other nodes' config. Zero (the
  // proto3 default) in every other mode — absent on the wire, byte-identical to before.
  uint64 lease_window = 6;
  // The appending leader's SYNCHRONIZED WALL-CLOCK reading (nanos since a cluster-wide epoch) when
  // it appended this entry — used ONLY by the LeaseGuard FAILOVER tier (inherited reads + the precise
  // commit-anchor) to compare a prior leader's stamp to a successor's clock across nodes, which needs
  // bounded clock skew. Distinct from timestamp (5), which is per-node MONOTONIC and never compared
  // cross-node. Zero (the proto3 default) outside the failover tier — absent on the wire, byte-identical
  // to before. See WIRE.md and the 2026-06-14 failover-reads design.
  uint64 wall_timestamp = 7;
}

// Entry discriminant. Zero = Normal so the dominant case is the proto3 default.
// The three merge kinds (5..=7) were RESERVED by the split milestone's LABEL_VERSION 3 bump and
// are mapped by the merge milestone — no wire change, as the reservation promised. ThawDischarged
// (8) is added under the still-UNRELEASED LABEL_VERSION 3 — a new kind, not a version bump.
enum EntryKind {
  ENTRY_KIND_NORMAL = 0;
  ENTRY_KIND_CONF_CHANGE = 1;
  ENTRY_KIND_EMPTY = 2;
  ENTRY_KIND_SET_READ_MODE = 3;
  ENTRY_KIND_SPLIT = 4;
  ENTRY_KIND_PREPARE_MERGE = 5;
  ENTRY_KIND_COMMIT_MERGE = 6;
  ENTRY_KIND_ROLLBACK_MERGE = 7;
  ENTRY_KIND_THAW_DISCHARGED = 8;
}

// The payload of an ENTRY_KIND_SPLIT entry (rides Entry.data). G-free: `child` is the embedder's
// group id encoded by its Data impl (1..=1024 bytes, decoded with decode_exact — the group-tag
// bound), so the group-unaware consensus core can decode and apply the entry. `instruction` is
// the embedder's opaque partition rule; sailing never reads it. The forked state itself never
// rides the entry — every replica derives it locally at apply — so a split's wire cost is
// independent of state size. child_gen / parent_gen_after are the ids' lineage counters (one
// unified monotone per-id counter for incarnation and shape). Rides LABEL_VERSION 3.
message SplitPayload {
  bytes child = 1;
  uint64 child_gen = 2;
  uint64 parent_gen_after = 3;
  bytes instruction = 4;
}

// The payload of an ENTRY_KIND_PREPARE_MERGE entry (rides Entry.data), proposed on the SOURCE
// group's log: freeze this group so `target` can absorb it. G-free like SplitPayload — `target`
// is the embedder's group id encoded by its Data impl (1..=1024 bytes, decode_exact).
// `source_gen_after` is the source's lineage counter after the freeze applies (the one unified
// monotone per-id counter). Deliberately NO lease/clock field: the freeze kills lease serving at
// APPEND observation of this entry, so the merge choreography is clock-free end to end.
message PrepareMergePayload {
  bytes target = 1;
  uint64 source_gen_after = 2;
}

// The payload of an ENTRY_KIND_COMMIT_MERGE entry (rides Entry.data), proposed on the TARGET
// group's log: absorb the frozen `source` at exactly `freeze_index`. The absorbed state itself
// never rides the entry — every replica extracts its LOCAL source replica at the freeze boundary
// — so the wire cost is independent of FSM size. `source_gen_after` is the gen the source's
// PrepareMerge set (the parked apply's abort comparator: a RollbackMerge that won the race on
// the source's log moved the counter past it); `target_gen_after` is the target's own lineage
// after the absorb (replay idempotence). `freeze_term` is the term of the source's PrepareMerge
// entry: with `freeze_index` it names the freeze's LOG IDENTITY, so a parked host whose local
// source log provably contains the committed freeze can advance that source's commit to the
// boundary without a live source leader (0 = no identity carried; never advance).
message CommitMergePayload {
  bytes source = 1;
  uint64 freeze_index = 2;
  uint64 source_gen_after = 3;
  uint64 target_gen_after = 4;
  uint64 freeze_term = 5;
}

// The payload of an ENTRY_KIND_ROLLBACK_MERGE entry (rides Entry.data) — the merge's explicit
// abort, in one of two log roles told apart by `source`:
//
//   - `source` PRESENT: the TARGET-side abort, proposed on the TARGET group's log so it is
//     totally ordered against CommitMerge on ONE log (a source-side abort has no cross-log
//     order against the target's commit, so observation timing would decide the race per
//     host). `source_gen_after` names the freeze generation being abandoned;
//     `target_gen_after` is the target's own lineage mint (the optimistic guard a split
//     carries): the abort applies only at exactly its minted generation, so aborts and
//     commits racing from one base resolve to one log-ordered winner on every replica.
//   - `source` ABSENT: the SOURCE-side unfreeze, proposed on the source's own log as the
//     container-relayed consequence of the target-side abort applying (log-borne so a restart
//     re-derives the thaw). `source_gen_after` moves the source's lineage past the freeze
//     generation; `target_gen_after` is 0 (absent). Byte-identical to the pre-abort encoding.
message RollbackMergePayload {
  uint64 source_gen_after = 1;
  bytes source = 2;
  uint64 target_gen_after = 3;
}

// The payload of an ENTRY_KIND_THAW_DISCHARGED entry (rides Entry.data), proposed on a merge
// TARGET's log: a committed witness that some leader OBSERVED this target's outstanding thaw
// obligation for `source` at freeze generation `generation` discharged (the source thawed past the
// abandoned freeze, or was terminally merged). Every replica's apply clears the obligation for
// exactly (source, generation) — so a replica that can never LOCALLY observe the source still
// clears, instead of fencing compaction and blocking teardown forever. G-free like the other merge
// payloads: `source` is the embedder's group id encoded by its Data impl (1..=1024 bytes,
// decode_exact — always present). Minted only from a globally-valid discharge proof, so it never
// clears a still-live obligation on a co-hosting holder. Rides LABEL_VERSION 3.
message ThawDischargedPayload {
  bytes source = 1;
  uint64 generation = 2;
}

// Cluster membership. Each repeated field is a SET: elements are the embedder's
// Data-encoded node ids, required strictly ascending by decoded value (duplicates and
// disorder reject at conversion — one set has one accepted encoding).
message ConfState {
  repeated bytes voters = 1;
  repeated bytes learners = 2;
  repeated bytes voters_outgoing = 3;
  repeated bytes learners_next = 4;
  bool auto_leave = 5;
}

// The durable, unforgeable identity of a split's forked child — the provenance token carried in a
// manufactured fork baseline's SnapshotMeta so a parked fork resolves REDUNDANT only against an
// exact match, never against an independently-created / squatter / recreated group that merely
// crossed the fork's applied/lineage thresholds by its own commits. All fields are properties of
// the committed split entry (replica-identical, since the split rides the parent's totally-ordered
// log): the group ids are their canonical Data encodings (1..=1024 bytes), parent_incarnation is
// the parent's lineage after the split (parent_gen_after), and (split_index, split_term) locate the
// split entry in the parent's log. Rides the (unreleased) group-tagged LABEL_VERSION.
message ForkId {
  bytes parent = 1;
  uint64 parent_incarnation = 2;
  uint64 split_index = 3;
  uint64 split_term = 4;
  bytes child = 5;
  uint64 child_gen = 6;
}

// Snapshot metadata: the compaction boundary and the membership AT that boundary.
message SnapshotMeta {
  uint64 last_index = 1;
  uint64 last_term = 2;
  ConfState conf = 3;
  // The max LeaseGuard commit-wait window (nanos) over the entries this snapshot subsumes — carried
  // so a node that compacts (or installs this snapshot) still bounds any deposed leader's lease on a
  // now-compacted entry. Zero in non-LeaseGuard clusters — absent on the wire, byte-identical to
  // before.
  uint64 max_lease_window = 4;
  // The max per-entry wall_timestamp + lease_window over the entries this snapshot subsumes — the
  // FAILOVER-tier precise commit-anchor's release floor, carried so a successor that compacted (or
  // installed) these entries still bounds a deposed leader's lease on a now-unavailable entry. Paired
  // PER ENTRY (never the max stamp with a different entry's window). Zero outside the failover tier —
  // absent on the wire, byte-identical to before.
  uint64 max_wall_plus_window = 5;
  // The max lease_window over the entries this snapshot subsumes that are LEASE-bearing but
  // WALL-ABSENT (lease_window > 0, wall_timestamp == 0) — the failover precise commit-anchor's
  // mono-frame fallback bound for wall-absent inherited leases, carried so a successor that compacted
  // (or installed) these entries still bounds a deposed leader's lease when no precise wall anchor
  // exists. Folded by the ENTRY property on EVERY node (the exact dual of max_wall_plus_window's
  // wall_timestamp != 0), so the floor is complete across heterogeneous per-node tiers: every
  // wall-absent lease entry contributes regardless of any node's config. It therefore EQUALS
  // max_lease_window in a non-failover LeaseGuard cluster (every entry is wall-absent), but is inert
  // there (only the failover tier reads it). A successor consuming this floor relies on every peer
  // populating it identically — which is exactly why this precise-anchor release bumps LABEL_VERSION
  // (mixed-version nodes that predate the consumed floors reject at the handshake).
  uint64 max_unwalled_lease_window = 6;
  // The ACTIVE read mode at the snapshot boundary (a SetReadMode compacted into this snapshot), encoded
  // WITH PRESENCE: 0 = absent/legacy (a pre-migration snapshot, or one that never set the mode), n = the
  // ReadOnlyOption discriminant + 1 (1=Safe, 2=LeaseBased, 3=LeaseGuard). Carried so a restarting node
  // recovers its migrated mode from replicated state; an ABSENT (0) value falls back to the static config,
  // so a pre-migration snapshot is NOT misread as an explicit migrate-to-Safe. Zero is absent on the wire
  // (byte-identical to a pre-migration peer); an explicit mode is present. Rides LABEL_VERSION 4
  // of the PRE-GROUP wire sequence (the version byte restarted at 1 for the group-tagged wire).
  uint64 read_only = 7;
  // The snapshotted group's lineage counter at the boundary — the ONE unified monotone per-id
  // counter for incarnation and shape (a split's parent_gen_after, a fork child's child_gen, a
  // reshaping catalog's incarnation). Carried so a node restoring this snapshot knows its
  // lineage without replaying the split entries the snapshot subsumed; admission seeds the
  // container's replay guard from it. Zero (an unreshaped id) is absent on the wire —
  // byte-identical to a pre-P6 peer's meta. Rides LABEL_VERSION 3.
  uint64 shape_gen = 8;
  // The forked child's provenance token when this snapshot is (or descends from) a fork baseline —
  // a manufactured fork install writes it, the child's own later snapshots preserve it, and a peer
  // installing one adopts it. ABSENT for every non-fork snapshot (byte-identical to a pre-provenance
  // peer's meta). Rides the (unreleased this cycle) group-tagged LABEL_VERSION.
  ForkId fork_id = 9;
}

// Log replication / heartbeat-with-entries.
message AppendEntries {
  uint64 term = 1;
  bytes leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}

message AppendResponse {
  uint64 term = 1;
  bytes from_id = 2;
  bool reject = 3;
  uint64 reject_hint_index = 4;
  uint64 reject_hint_term = 5;
  uint64 match_index = 6;
  // The prev_log_index of the AppendEntries this response rejects (0 on success, or from a peer that
  // predates this field). Lets the leader ignore a stale/duplicate reject whose rejected index is at or
  // below the proven match, per etcd's MaybeDecrTo staleness guard.
  uint64 rejected_index = 7;
}

// Vote / PreVote request.
message RequestVote {
  uint64 term = 1;
  bytes candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  bool pre_vote = 5;
  bool leader_transfer = 6;
}

message VoteResponse {
  uint64 term = 1;
  bytes from_id = 2;
  bool pre_vote = 3;
  bool reject = 4;
}

message Heartbeat {
  uint64 term = 1;
  bytes leader_id = 2;
  uint64 commit = 3;
  // ReadIndex correlation context (opaque; empty when the round confirms no read).
  bytes context = 4;
  uint64 lease_round = 5;
}

message HeartbeatResponse {
  uint64 term = 1;
  bytes from_id = 2;
  bytes context = 3;
  uint64 lease_round = 4;
  // The lease-support promise window. nanos must be < 1_000_000_000, validated at
  // conversion BEFORE narrowing - the field is uint64 so an oversized varint is seen
  // and rejected rather than silently truncated to 32 bits (protobuf uint32 decoding
  // truncates by spec, which would make the bound unenforceable at the envelope).
  uint64 lease_support_secs = 5;
  uint64 lease_support_nanos = 6;
  // The boundary of a merge park the respondent cannot resolve locally: the parked
  // CommitMerge's index, i.e. the coordinate a cure must cover. Zero (the proto3 default)
  // means no such park stands, so an ordinary response is byte-identical to before the
  // field existed.
  uint64 stuck_boundary = 7;
}

// Leader -> follower: install a snapshot (the follower is too far behind).
message InstallSnapshot {
  uint64 term = 1;
  bytes leader_id = 2;
  SnapshotMeta snapshot = 3;
  bytes data = 4;
  uint64 offset = 5;
  uint64 total_len = 6;
}

message SnapshotResponse {
  uint64 term = 1;
  bytes from_id = 2;
  bool reject = 3;
  uint64 match_index = 4;
  uint64 acked_through = 5;
  // Mid-transfer progress ack: match-inert on the leader (drives chunk pacing only, never
  // Progress). False (absent) on every final/redundancy ack.
  bool progress = 6;
}

// Leader -> transfer target: campaign NOW (bypasses the pre-vote lease).
message TimeoutNow {
  uint64 term = 1;
  bytes leader_id = 2;
}

// Follower -> leader: confirm a linearizable read (forwarded read-index).
message ReadIndex {
  uint64 term = 1;
  bytes from_id = 2;
  bytes context = 3;
}

message ReadIndexResponse {
  uint64 term = 1;
  bytes from_id = 2;
  uint64 index = 3;
  bytes context = 4;
  bool reject = 5;
}

// A single configuration change step.
message ConfChangeSingle {
  ConfChangeType change_type = 1;
  bytes node_id = 2;
}

// Conf-change discriminant. Zero = AddNode so the dominant case is the proto3 default.
enum ConfChangeType {
  CONF_CHANGE_TYPE_ADD_NODE = 0;
  CONF_CHANGE_TYPE_REMOVE_NODE = 1;
  CONF_CHANGE_TYPE_ADD_LEARNER_NODE = 2;
}

// The v1 (single-step) conf change, carried as an Entry payload.
message ConfChange {
  ConfChangeType change_type = 1;
  bytes node_id = 2;
  bytes context = 3;
}

// The v2 (joint-capable) conf change, carried as an Entry payload.
message ConfChangeV2 {
  ConfChangeTransition transition = 1;
  repeated ConfChangeSingle changes = 2;
  bytes context = 3;
}

// Joint-consensus transition policy.
enum ConfChangeTransition {
  CONF_CHANGE_TRANSITION_AUTO = 0;
  CONF_CHANGE_TRANSITION_IMPLICIT = 1;
  CONF_CHANGE_TRANSITION_EXPLICIT = 2;
}

// The consensus RPC envelope: exactly one frame carries exactly one Message.
// An absent body rejects at conversion (parity with the prior unknown-tag reject).
message Message {
  oneof body {
    AppendEntries append_entries = 1;
    AppendResponse append_response = 2;
    RequestVote request_vote = 3;
    VoteResponse vote_response = 4;
    Heartbeat heartbeat = 5;
    HeartbeatResponse heartbeat_response = 6;
    InstallSnapshot install_snapshot = 7;
    SnapshotResponse snapshot_response = 8;
    TimeoutNow timeout_now = 9;
    ReadIndex read_index = 10;
    ReadIndexResponse read_index_response = 11;
  }
}
