[package]
name = "sailing-simulation"
description = "Deterministic simulation harness for sailing-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# When enabled, every consensus message is round-tripped through the real `Message<I>` wire codec
# (encode -> decode) at the delivery seam — so the whole VOPR fuzzer exercises the codec under
# crashes, partitions, and membership churn. Off by default (the codec round-trip is a verified
# identity, so it does not change behavior, but it adds per-message overhead).
wire = []

[dependencies]
sailing-proto = { workspace = true, features = ["std"] }
bytes.workspace = true
derive_more.workspace = true

[dev-dependencies]
# Bench-only: criterion without plotters/rayon (lean dep tree; `cargo bench` + CI compile-check).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# The Tier B coordinator scenarios drive the REAL multi stream coordinator; scoping the `tcp`
# feature to dev-dependencies keeps the library target's dependency footprint std-only. The
# `fuzzing` feature rides here for the same reason the conformance crate carries it: a harness
# unit test fabricates a committed `CommitMerge` entry on a replica's durable log (no organic drive
# leaves a park standing over a source the world hosts nowhere), and the only encoder for that
# payload is the off-by-default, doc(hidden) minting seam — reached by this crate's tests alone,
# never by its library target.
sailing-proto = { workspace = true, features = ["std", "tcp", "fuzzing"] }

[[bench]]
name = "endpoint"
harness = false

[[bench]]
name = "reshape"
harness = false

[lints]
workspace = true
