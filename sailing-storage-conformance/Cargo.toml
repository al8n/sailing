[package]
name = "sailing-storage-conformance"
description = "A conformance kit for sailing's storage seams: suites a store or engine implementation runs against itself, plus the crash/fault reference types they need"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The `fuzzing` feature rides the NORMAL dependency, not a dev-dependency: the reference subjects
# that MINT a shape entry are shipped in this crate's `src/`, so its library target — not only its
# tests — must see the off-by-default minting seam. `publish = false` is what makes that acceptable:
# a doc(hidden), no-semver module reaches nothing outside this harness.
sailing-proto = { workspace = true, features = ["std", "fuzzing"] }
bytes.workspace = true

[lints]
workspace = true
